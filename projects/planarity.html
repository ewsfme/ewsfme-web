<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planar Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;700&display=swap');
    </style>
    <link rel="stylesheet" type="text/css" href="../styles/planarity.css">
</head>
<body>

    <div class="planar-container">
        <a href="../#projects" class="back-arrow" title="Back to site">←</a>
        <div class="status-bar">
            <span>INTERSECTIONS: <strong id="intersections" class="intersection-count">Calculating...</strong></span>
            <button type="button" class="btn-restart" onclick="initLevel()" style="padding: 4px 12px; background: transparent; border: 1px solid var(--border-color); color: var(--accent-hover); font-family: var(--font-mono); border-radius: 4px; cursor: pointer;">Shuffle</button>
        </div>

        <canvas id="planar-canvas" width="460" height="460"></canvas>
    </div>

    <script src="../scripts/planarity.js"></script>
</body>
</html>
